  thunder_deid: "-"
  jang2024: "- (CV_POSITION은 직위)"
  notes: "occupation = 직종(회사원·자영업). 직장명은 I/employer_affiliation."

- id: credit_score
  tier: L
  kind: attribute
  name_ko: 개인신용평점
  name_en: Credit score / grade
  legal_basis: "CIA §2 1호의6 라목"
  span_policy: mask_if_linked
  deid_default: generalize
  format: {pattern: "NICE/KCB 점수 (0~1000), 등급 1~10, 내부 등급", checksum: false}
  thunder_deid: "-"
  jang2024: "-"

- id: public_record
  tier: L
  kind: attribute
  name_ko: 공공정보
  name_en: Public record
  legal_basis: "CIA §2 1호의6 가~다목 (재판·행정처분, 조세·국가채권, 채무조정)"
  span_policy: mask_if_linked
  deid_default: suppress
  format: {pattern: "파산·회생 결정, 세금 체납, 압류, 개인워크아웃", checksum: false}
  thunder_deid: "사건관계인이력 (부분)"
  jang2024: "-"

- id: sensitive_info
  tier: L
  kind: attribute
  name_ko: 민감정보
  name_en: Sensitive information
  legal_basis: "PIPA §23; PIPA 시행령 §18 (건강·유전·범죄경력·인종·민족·사상·신념·노조·정당·정치적 견해·성생활)"
  span_policy: must_mask
  deid_default: suppress
  format: {pattern: "질병명·진단·수술 (보험청구), 범죄경력, 종교, 정치 성향 언급", checksum: false}
  subtypes: [health, criminal_record, belief_religion_politics, union, ethnicity, sexual_life]
  thunder_deid: "사건관계인이력 > 범죄경력"
  jang2024: OGG_RELIGION
  notes: "보험금 청구·상담 문서에서 health가 지배적. 국적은 민감정보 아님 → I/nationality."

# ===== Tier I / identifiability (법령 미열거; 재식별·프로파일링 위험) =====

- id: dob_age
  tier: I
  kind: attribute
  name_ko: 생년월일·연령
  name_en: Date of birth / age
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize   # 10세 단위 (가명정보 가이드라인)
  format: {pattern: "YYYY년 M월 D일, 90년생, 만 34세, 30대", checksum: false}
  subtypes: [full_dob, birth_year, age, age_band]
  thunder_deid: "연령정보"
  jang2024: "DT_BIRTH / QT_AGE"
  notes: "PIPA §2상 개인정보이나 CIA 식별정보 열거에 없음 → I. 리뷰어가 L 주장 가능; taxonomy.md에 근거 서술."

- id: gender
  tier: I
  kind: attribute
  name_ko: 성별
  name_en: Gender
  legal_basis: null
  span_policy: detect_only
  deid_default: keep
  format: {pattern: "남/여, 남성/여성, 호칭(아버님·여사님)", checksum: false}
  thunder_deid: "-"
  jang2024: CV_SEX

- id: nationality
  tier: I
  kind: attribute
  name_ko: 국적
  name_en: Nationality
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "국가명, '외국인', 체류자격(F-4 등)", checksum: false}
  thunder_deid: "-"
  jang2024: LCP_COUNTRY
  notes: "인종·민족은 L/sensitive_info. 국적은 아님."

- id: family_relation
  tier: I
  kind: attribute
  name_ko: 가족관계
  name_en: Family relation
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "배우자·자녀 N명·부양가족, 가족 이름과의 관계 표현", checksum: false}
  thunder_deid: "-"
  jang2024: "-"
  notes: "가족 '이름'은 person_name. 여기는 관계 표현만."

- id: employer_affiliation
  tier: I
  kind: attribute
  name_ko: 직장·소속
  name_en: Employer / affiliation
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "회사명, 부서, 직위/직급, 재직기간", checksum: false}
  subtypes: [employer_name, department, position, tenure]
  thunder_deid: "사업체 / 조직 > 조직 내 세부부서·업무·권한"
  jang2024: "OG_WORKPLACE / OG_DEPARTMENT / CV_POSITION"
  notes: "직종(회사원·자영업)은 L/financial_capacity.occupation. 여기는 특정 조직명·직위."

- id: education
  tier: I
  kind: attribute
  name_ko: 학력
  name_en: Education
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "학교명, 전공, 졸업연도, 학위", checksum: false}
  thunder_deid: "기관 및 시설 > 교육기관"
  jang2024: "OGG_EDUCATION / FD_MAJOR / QT_GRADE"

- id: life_event
  tier: I
  kind: attribute
  name_ko: 생애 사건
  name_en: Life event
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "결혼·출산·이직·퇴직·상속·이혼·이사·유학 등 상담 중 언급", checksum: false}
  thunder_deid: "-"
  jang2024: "-"
  notes: "초개인화 피싱의 핵심 재료 (예: '최근 퇴직금 수령'). 사건 + 시점 표현을 하나의 스팬으로."

- id: investment_profile
  tier: I
  kind: attribute
  name_ko: 투자성향
  name_en: Investment risk profile
  legal_basis: null   # 자본시장법 §46 적합성 원칙상 수집 의무는 있으나 CIA 신용정보 열거에 없음
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "공격투자형/적극/위험중립/안정추구/안정형, 투자 목적·경험·기간, 위험등급 1~5", checksum: false}
  thunder_deid: "-"
  jang2024: "-"
  notes: "증권 도메인 고유. 보유 종목·수량은 L/credit_transaction.securities_holdings."

- id: consultation_content
  tier: I
  kind: attribute
  name_ko: 상담·민원 내용
  name_en: Consultation / complaint content
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "불만 사유, 문의 주제, 요청 사항, 상담사 메모 요약 (절 단위 스팬)", checksum: false}
  subtypes: [complaint_reason, inquiry_topic, request, agent_note]
  thunder_deid: "-"
  jang2024: "-"
  notes: "가장 경계가 모호한 카테고리. 어노테이션 가이드: '이 문장을 제3자가 알면 고객을 특정·설득하는 데 쓸 수 있는가'. IAA를 별도 보고."

- id: service_usage
  tier: I
  kind: attribute
  name_ko: 서비스 이용 패턴
  name_en: Service usage pattern
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "접속 시간대·빈도, 이용 채널(앱/ATM/지점), 주 이용 서비스, 알림 설정", checksum: false}
  thunder_deid: "-"
  jang2024: "-"
  notes: "성현 제안 항목. 로그 성 문서(이용내역, CS 시스템 메모)에서 등장."

- id: device_network
  tier: I
  kind: attribute
  name_ko: 기기·네트워크 정보
  name_en: Device / network identifier
  legal_basis: null   # IP는 PIPA상 개인정보로 해석되는 경우 많음 — 경계 사례 [?]
  span_policy: detect_only
  deid_default: surrogate
  format: {pattern: "IPv4/IPv6, 기기 모델·OS, 앱 설치 ID, MAC", checksum: false}
  subtypes: [ip, device_model, install_id]
  thunder_deid: "-"
  jang2024: QT_IP
  notes: "IP를 L로 올릴지 ADR-0004 열린 질문. v1은 I."

- id: location_mention
  tier: I
  kind: attribute
  name_ko: 위치·지역 언급
  name_en: Location mention (non-address)
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "거주 시/군/구·동 단위 언급, 방문 지점명, 근무지 지역, 해외 체류지", checksum: false}
  subtypes: [residence_area, branch_visited, travel]
  thunder_deid: "지리정보 > 지역명; 사건 관련 장소"
  jang2024: LC_PLACE
  notes: "완전 주소는 L/address. '분당 사는', '강남역 지점 방문'은 여기."

- id: lifestyle_indicator
  tier: I
  kind: attribute
  name_ko: 생활·소비 지표
  name_en: Lifestyle / consumption indicator
  legal_basis: null
  span_policy: detect_only
  deid_default: generalize
  format: {pattern: "보유 차량 모델, 주거 형태(자가/전세), 취미, 반복 소비 카테고리(해외직구·골프)", checksum: false}
  thunder_deid: "상품 일반 (부분)"
  jang2024: "-"
  notes: "재산 '가액'은 L/financial_capacity.assets. 여기는 정성적 지표."

# ---------------------------------------------------------------------------
exclusions:
  - biometric: "PIPA 시행령 §18 3호·CIA §2 1호의2 가목 3). 텍스트 스팬으로 나타나지 않아 벤치마크 범위 밖. 논문 Limitations에 명시."
  - organization_names_public: "은행·증권사·상품명 등 공개 정보는 단독 스팬 아님. Thunder-DeID와의 차이점 (그들은 판결문 맥락상 준식별자로 처리)."
  - monetary_amount_alone: "금액 단독은 스팬 아님. 계약 조건·거래 행 맥락에서 credit_transaction/transaction_record로 잡음."

document_types:   # 합성 코퍼스 생성용 인벤토리 (초안). 각 문서에 등장 가능한 카테고리 힌트.
  - {id: kyc_form, name_ko: 계좌개설·KYC 신청서, dominant: [person_name, rrn, address, phone_no, email, financial_capacity, investment_profile]}
  - {id: bank_statement, name_ko: 입출금 거래명세서, dominant: [bank_account_no, transaction_record, person_name]}
  - {id: card_statement, name_ko: 카드 이용명세서, dominant: [card_no, transaction_record, credit_transaction]}
  - {id: loan_contract, name_ko: 대출 계약서·약정서, dominant: [contract_no, credit_transaction, rrn, address, financial_capacity]}
  - {id: insurance_claim, name_ko: 보험금 청구서·심사 메모, dominant: [contract_no, sensitive_info.health, person_name, bank_account_no]}
  - {id: cs_transcript, name_ko: 고객상담 녹취록·채팅, dominant: [person_name, phone_no, consultation_content, life_event, customer_id]}
  - {id: complaint_case, name_ko: 민원 접수·처리 기록, dominant: [consultation_content, contract_no, delinquency_info, public_record]}
  - {id: securities_trade_report, name_ko: 증권 거래내역·잔고, dominant: [securities_account_no, credit_transaction.securities_holdings, investment_profile]}
  - {id: internal_memo, name_ko: 내부 심사·검토 메모 (다수 고객 언급), dominant: [multi-subject: person_name, customer_id, credit_score, delinquency_info]}
  - {id: phishing_report, name_ko: 사기·피싱 신고 접수, dominant: [access_credential, phone_no, bank_account_no, transaction_record]}

